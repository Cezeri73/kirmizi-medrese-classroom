name: Generate modules.json

on:
  push:
    branches: ["main"]
    paths:
      - "modules/**"
      - ".github/workflows/generate-modules-json.yml"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate modules/modules.json (from HTML <title>)
        run: |
          node -e "
          const fs=require('fs');
          const path=require('path');

          const dir='modules';
          if(!fs.existsSync(dir)){
            fs.mkdirSync(dir, {recursive:true});
          }

          const files=fs.readdirSync(dir)
            .filter(f => f.toLowerCase().endsWith('.html'))
            .sort();

          function pickTitle(html, fallback){
            const m = html.match(/<title[^>]*>([\\s\\S]*?)<\\/title>/i);
            if(!m) return fallback;
            return m[1].replace(/\\s+/g,' ').trim();
          }

          function guessDate(name){
            const m = name.match(/(20\\d{2}-\\d{2}-\\d{2})/);
            return m ? m[1] : '';
          }

          const items = files.map(f => {
            const full = path.join(dir, f);
            const html = fs.readFileSync(full, 'utf8');
            const fallback = f.replace(/\\.html$/i,'').replaceAll('-', ' ').trim();

            return {
              title: pickTitle(html, fallback),
              date: guessDate(f),
              href: `./modules/${f}`,
              tags: [],
              minutes: 50,
              note: ''
            };
          });

          fs.writeFileSync(path.join(dir,'modules.json'), JSON.stringify(items,null,2));
          console.log('Generated modules/modules.json with', items.length, 'items');
          "

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/modules.json
          git diff --cached --quiet || git commit -m "chore: auto-generate modules.json"
          git push